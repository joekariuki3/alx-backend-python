name: run-tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MESSAGING_APP_DB }}
          MYSQL_USER: ${{ secrets.MESSAGING_APP_USER }}
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v2
      - name: setup python
        uses: actions/setup-python@v2
        with:
            python-version: 3.10

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run tests
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: ${{ secrets.MESSAGING_APP_DB }}
          DB_USER: ${{ secrets.MESSAGING_APP_USER }}
          DB_PASSWORD: ${{ secrets.MESSAGING_APP_PASSWORD }}
        run: |
            pytest